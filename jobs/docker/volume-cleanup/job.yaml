name: Clean Up Docker Dangling Images
description: Removes dangling Docker images from the host where the worker is running
image: docker
cron: "0 3 * * *"
resources:
  cpu: 0.2
  memory: 128mb
  timeout: 2m
command:
  - docker
  - image
  - prune
  - -f
tags:
  - local
  - node
mode: once_all
volumes:
  - /var/run/docker.sock:/var/run/docker.sock
