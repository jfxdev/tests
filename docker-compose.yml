version: '3.8'
services:
  nginx:
    container_name: nginx
    image: nginx:1.28.2-alpine
    ports:
      - "8082:80"
    restart: unless-stopped
    environment:
      - TEST_VAR=${TEST_VAR}
      - TEST_VAR1=${TEST_VAR1}
      - TEST_VAR2=${TEST_VAR2}
    command: >
      sh -c "echo '<html><body><h1>Env Vars</h1><pre>' > /usr/share/nginx/html/index.html
      && env | sort >> /usr/share/nginx/html/index.html
      && echo '</pre></body></html>' >> /usr/share/nginx/html/index.html
      && nginx -g 'daemon off;'"
    volumes:
      - nginx_data:/usr/share/nginx/csv
    networks:
      - app_network

  nginx2:
    container_name: nginx2
    image: nginx:1.28.2-alpine
    ports:
      - "8083:80"
    restart: unless-stopped
    environment:
      - TEST_VAR=${TEST_VAR}
    command: >
      sh -c "echo '<html><body><h1>Env Vars</h1><pre>' > /usr/share/nginx/html/index.html
      && env | sort >> /usr/share/nginx/html/index.html
      && echo '</pre></body></html>' >> /usr/share/nginx/html/index.html
      && nginx -g 'daemon off;'"
    volumes:
      - nginx_data:/usr/share/nginx/csv
    networks:
      - app_network

volumes:
  nginx_data:
    driver: local
 
networks:
  app_network:
    driver: bridge
