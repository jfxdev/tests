name: Limpar containers parados
description: Remove containers Docker parados do host onde o worker esta rodando
image: docker
cron: "30 3 * * *"
resources:
  cpu: 1
  memory: 256mb
  timeout: 2m
command:
  - docker
  - container
  - prune
  - -f
tags:
  - local
  - node
mode: once_all
volumes:
  - /var/run/docker.sock:/var/run/docker.sock
